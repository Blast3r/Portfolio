    <script>
        window.addEventListener('load', () => {
            const overlay = document.querySelector('.page-transition-overlay');
            if(overlay) {
                setTimeout(() => { overlay.classList.add('reveal-x'); }, 50);
            }
        });

        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                const overlay = document.querySelector('.page-transition-overlay');
                if (overlay) {
                    overlay.classList.remove('cover-x', 'cover-y');
                    if (overlay.classList.contains('origin-top') || overlay.classList.contains('origin-bottom')) {
                        overlay.classList.add('reveal-y');
                    } else {
                        overlay.classList.add('reveal-x');
                    }
                }
            }
        });

        const transitionLinks = document.querySelectorAll('a:not([target="_blank"])');
        transitionLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const targetUrl = this.getAttribute('href');
                if (!targetUrl || targetUrl === '#') return;

                e.preventDefault(); 
                const overlay = document.querySelector('.page-transition-overlay');
                if (overlay) {
                    overlay.className = 'page-transition-overlay bg-black';
                    if (targetUrl.includes('thesis')) {
                        overlay.classList.add('origin-right', 'reveal-x');
                        setTimeout(() => overlay.classList.replace('reveal-x', 'cover-x'), 10);
                    }
                    else if (targetUrl.includes('cv.html')) {
                        overlay.classList.add('origin-bottom', 'reveal-y');
                        setTimeout(() => overlay.classList.replace('reveal-y', 'cover-y'), 10);
                    } else if (targetUrl.includes('index.html')) {
                        overlay.classList.add('origin-top', 'reveal-y');
                        setTimeout(() => overlay.classList.replace('reveal-y', 'cover-y'), 10);
                    } else {
                        overlay.classList.add('origin-left', 'reveal-x');
                        setTimeout(() => overlay.classList.replace('reveal-x', 'cover-x'), 10);
                    }
                }
                setTimeout(() => { window.location.href = targetUrl; }, window.__transitionDelay());
            });
        });

        const mediaItems = document.querySelectorAll('.media-item');
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        let currentImg = new Image();
        let animId;

        // Önizleme tuvali sadece masaüstünde çalışır. Mobilde tuval
        // gizlendiği için (genişlik 0) hem gereksiz hem de hatalı çiziyordu.
        const previewActive = () => canvas.parentElement.offsetWidth > 0;

        function drawPixelated(img, size) {
            if (!previewActive() || !img || !img.complete || !img.naturalWidth) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.imageSmoothingEnabled = false;

            const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (canvas.width - w) / 2;
            const y = (canvas.height - h) / 2;

            if (size <= 1) {
                ctx.drawImage(img, x, y, w, h);
            } else {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width / size;
                tempCanvas.height = canvas.height / size;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(img, x / size, y / size, w / size, h / size);
                ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
            }
        }

        function transitionImage(newSrc) {
            if (!previewActive()) return;
            const nextImg = new Image();
            nextImg.src = newSrc;
            nextImg.onload = () => {
                let size = 1;
                let phase = 1;
                cancelAnimationFrame(animId);
                
                function animate() {
                    size += phase * 4;
                    if (size > 40) {
                        phase = -1;
                        currentImg = nextImg;
                    }
                    if (size <= 1 && phase === -1) {
                        size = 1;
                        drawPixelated(currentImg, size);
                        return;
                    }
                    drawPixelated(phase === 1 ? currentImg : nextImg, size);
                    animId = requestAnimationFrame(animate);
                }
                animate();
            };
        }

        if (mediaItems.length > 0) {
            currentImg.src = mediaItems[0].getAttribute('data-src');
            currentImg.onload = () => drawPixelated(currentImg, 1);
        }

        // Yerleşim tam oturduktan sonra bir kez daha çiz. Önceden ilk
        // çizim, panel son genişliğine ulaşmadan yapıldığı için
        // görselin iki yanında boş şerit kalıyordu.
        window.addEventListener('load', () => drawPixelated(currentImg, 1));
        if (window.ResizeObserver) {
            new ResizeObserver(() => drawPixelated(currentImg, 1))
                .observe(canvas.parentElement);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => drawPixelated(currentImg, 1), 150);
        });

        // Fare ile üzerine gelince önizleme değişir (masaüstü).
        // Dokunmatikte 'mouseenter' hiç tetiklenmediği için mobilde
        // liste zaten kendi kapak görselleriyle çalışıyor.
        mediaItems.forEach(item => {
            item.addEventListener('mouseenter', function() {
                if (!previewActive()) return;
                if (this.classList.contains('active')) return;
                mediaItems.forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                transitionImage(this.getAttribute('data-src'));
            });
        });
    </script>
</body>
