<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melih G. Kutsal - Index</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared-ui.css">
</head>
<body>

    <div class="page-transition-overlay origin-top bg-black"></div>

    <header class="top-bar">
        <a href="cv.html" class="name-link">Melih G. Kutsal [CV]</a>

        <a href="index.html" class="logo-link dynamic-logo-container">
            <svg class="dynamic-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g class="triangle-group">
                    <polygon class="triangle triangle-1" points="50,15 70,50 30,50" />
                    <polygon class="triangle triangle-2" points="30,50 50,85 10,85" />
                    <polygon class="triangle triangle-3" points="70,50 90,85 50,85" />
                </g>
            </svg>
        </a>

        <span class="sys-text">SYS.ONLINE</span>
    </header>

    <main class="wireframe-container">

        <!-- ÜST SATIR:  MEDIA · ARCHITECT  (kelime oyunu) -->
        <a href="media-art.html" class="split-panel panel-tl">
            <span class="panel-fig">[FIG. 01]</span>
            <h1 class="wordplay-text align-right">
                MEDIA<span class="reveal">&nbsp;ART</span>
            </h1>
            <span class="panel-dest">MEDIA ART</span>
            <span class="panel-cta cta-br">VIEW_WORKS -&gt;</span>
        </a>

        <a href="architecture.html" class="split-panel panel-tr">
            <span class="panel-fig">[FIG. 02]</span>
            <h1 class="wordplay-text align-left">
                ARCHITECT<span class="reveal">URE</span>
            </h1>
            <span class="panel-dest">ARCHITECTURE</span>
            <span class="panel-cta cta-bl">&lt;- VIEW_PROJECTS</span>
        </a>

        <!-- ALT SATIR:  RESEARCH · THESIS -->
        <a href="https://parametric-architecture.com/author/holymelee/" target="_blank" rel="noopener" class="split-panel panel-bl">
            <span class="panel-fig">[FIG. 03]</span>
            <h1 class="wordplay-text align-right">
                RESEARCH<span class="reveal">&nbsp;ARTICLES</span>
            </h1>
            <span class="panel-dest">RESEARCH ARTICLES</span>
            <span class="panel-cta cta-tr">EXTERNAL_LOGS -&gt;</span>
        </a>

        <a href="thesis.html" class="split-panel panel-br">
            <span class="panel-fig">[FIG. 04]</span>
            <h1 class="wordplay-text align-left">
                THESIS<span class="reveal">&nbsp;WORK</span>
            </h1>
            <span class="panel-dest">THESIS WORK</span>
            <span class="panel-cta cta-tl">&lt;- READ_THESIS</span>
        </a>

        <div class="crosshair center-cross">+</div>

    </main>

    <footer class="status-bar">
        <span class="foot-name">MELIH G. KUTSAL</span>
        <span class="foot-role">"MEDIA" ARCHITECT</span>
        <span class="foot-sys"><span class="blink-cursor">&gt;</span> SYS.ONLINE</span>
    </footer>

    <script src="shared-ui.js" defer></script>
    <script>
        // 1. Sayfa Açılış Animasyonu
        window.addEventListener('load', () => {
            const overlay = document.querySelector('.page-transition-overlay');
            if (overlay) {
                setTimeout(() => { overlay.classList.add('reveal-y'); }, 50);
            }
        });

        // 2. Linklere Tıklama ve Yönlendirme Animasyonu
        const transitionLinks = document.querySelectorAll('a:not([target="_blank"])');

        transitionLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                const targetUrl = this.getAttribute('href');
                if (!targetUrl || targetUrl === '#') return;

                e.preventDefault();

                // Panel Genişleme Animasyonu (dört kutudan hangisiyse o büyür)
                if (this.classList.contains('split-panel')) {
                    this.classList.add('expanding');
                }
                // Üst Bar Yönlendirme Animasyonları (CV ve Ana Sayfa)
                else {
                    const overlay = document.querySelector('.page-transition-overlay');
                    if (overlay) {
                        overlay.className = 'page-transition-overlay bg-black';

                        if (targetUrl.includes('cv.html')) {
                            overlay.classList.add('origin-bottom', 'reveal-y');
                            setTimeout(() => overlay.classList.replace('reveal-y', 'cover-y'), 10);
                        }
                        else if (targetUrl.includes('index.html')) {
                            overlay.classList.add('origin-top', 'reveal-y');
                            setTimeout(() => overlay.classList.replace('reveal-y', 'cover-y'), 10);
                        }
                    }
                }

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, window.__transitionDelay());
            });
        });

        // 3. Tarayıcı Geri Tuşu (BFCache) Düzeltmesi
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                const overlay = document.querySelector('.page-transition-overlay');
                if (overlay) {
                    overlay.classList.remove('cover-x', 'cover-y');
                    overlay.classList.add('origin-top', 'reveal-y');
                }
                document.querySelectorAll('.expanding')
                        .forEach(el => el.classList.remove('expanding'));
            }
        });
    </script>

</body>
</html>
